# Main nginx configuration for the desk UI.
#
# Hosts like blitz.cloud run the container as a regular user, so nothing here
# may write to /var/run, /var/cache or /var/log: the pid file, the temp paths
# and both logs are pointed at /tmp or at the container's stdout/stderr.
# The server block itself is rendered from a template at container start into
# /tmp/nginx/conf, because /etc/nginx is not writable for an unprivileged user.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The upstream fields say whether a 4xx/5xx came from nginx itself (blank
    # upstream) or from the API part (status 4xx/5xx on an address).
    log_format desk '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr upstream_status=$upstream_status '
                    't=$request_time';

    access_log /dev/stdout desk;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    include /tmp/nginx/conf/*.conf;
}
