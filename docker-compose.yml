services:
  backend:
    build:
      context: ./backend
    image: wind-forecast-desk-backend:latest
    environment:
      WIND_DESK_DATA_DIR: /data
      # The browser talks to nginx, which proxies /api, so CORS is only needed
      # when the API is hit directly from another origin.
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - wind_desk_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: wind-forecast-desk-frontend:latest
    depends_on:
      - backend
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes:
  wind_desk_data:
